name: Fabric Dev → Test → Prod

# Promotion model:
#   ws-sales-dtp  (DEV — devs work in portal, this is "main")
#       │ on push to main
#       ▼
#   ws-sales-test  (auto-deploy)   value-set: test
#       │ manual approval (`prod` env)
#       ▼
#   ws-sales-prod  (deploy)         value-set: prod
#
# Items are exported under workspace/ in this repo (also tracked for review).
# CI uses fab CLI to mkdir target workspaces if missing, then cp items from
# the dev workspace to test/prod, then activates the right value-set.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CAPACITY_ID: fcad8576-813e-4f6d-baae-849840ed14ed   # fabraj64
  WS_DEV:  ws-sales-dtp
  WS_TEST: ws-sales-test
  WS_PROD: ws-sales-prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repo layout
        run: |
          test -f workspace/VariableLibraries/vl_sales_dtp.VariableLibrary/variables.json
          test -f workspace/Dataflows/df_load_factsales.Dataflow/mashup.pq
          for f in $(find workspace -name '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" >/dev/null && echo "✓ $f"
          done

  deploy-test:
    needs: validate
    runs-on: ubuntu-latest
    environment: test
    env:
      FABRIC_TENANT_ID:     ${{ secrets.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID:     ${{ secrets.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install fabric-cli
        run: pip install ms-fabric-cli
      - name: Authenticate
        run: |
          fab config set encryption_fallback_enabled true
          fab auth login -u "$FABRIC_CLIENT_ID" -p "$FABRIC_CLIENT_SECRET" --tenant "$FABRIC_TENANT_ID"
      - name: Ensure $WS_TEST workspace exists on capacity
        run: |
          if ! fab exists "$WS_TEST.Workspace" 2>/dev/null; then
            echo "Creating $WS_TEST..."
            fab mkdir "$WS_TEST.Workspace" -P "capacityId=$CAPACITY_ID"
          else
            echo "$WS_TEST already exists"
          fi
      - name: Promote items from $WS_DEV → $WS_TEST
        run: |
          for item in vl_sales_dtp.VariableLibrary df_load_factsales.Dataflow; do
            echo "→ $item"
            fab cp "$WS_DEV.Workspace/$item" "$WS_TEST.Workspace/$item" --force
          done
          # ensure target lakehouse exists
          if ! fab exists "$WS_TEST.Workspace/lh_sales_test.Lakehouse" 2>/dev/null; then
            fab mkdir "$WS_TEST.Workspace/lh_sales_test.Lakehouse"
          fi
      - name: Activate test value-set
        run: |
          fab set "$WS_TEST.Workspace/vl_sales_dtp.VariableLibrary" -q activeValueSet -i test || true
      - name: Smoke run dataflow
        run: |
          fab job run "$WS_TEST.Workspace/df_load_factsales.Dataflow" || echo "(refresh failed — likely needs destination bound in portal)"

  deploy-prod:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: prod
    env:
      FABRIC_TENANT_ID:     ${{ secrets.FABRIC_TENANT_ID }}
      FABRIC_CLIENT_ID:     ${{ secrets.FABRIC_CLIENT_ID }}
      FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ms-fabric-cli
      - name: Authenticate
        run: |
          fab config set encryption_fallback_enabled true
          fab auth login -u "$FABRIC_CLIENT_ID" -p "$FABRIC_CLIENT_SECRET" --tenant "$FABRIC_TENANT_ID"
      - name: Ensure $WS_PROD exists
        run: |
          if ! fab exists "$WS_PROD.Workspace" 2>/dev/null; then
            fab mkdir "$WS_PROD.Workspace" -P "capacityId=$CAPACITY_ID"
          fi
      - name: Promote items $WS_TEST → $WS_PROD
        run: |
          for item in vl_sales_dtp.VariableLibrary df_load_factsales.Dataflow; do
            fab cp "$WS_TEST.Workspace/$item" "$WS_PROD.Workspace/$item" --force
          done
          if ! fab exists "$WS_PROD.Workspace/lh_sales_prod.Lakehouse" 2>/dev/null; then
            fab mkdir "$WS_PROD.Workspace/lh_sales_prod.Lakehouse"
          fi
      - name: Activate prod value-set
        run: fab set "$WS_PROD.Workspace/vl_sales_dtp.VariableLibrary" -q activeValueSet -i prod || true
      - name: Refresh prod dataflow
        run: fab job run "$WS_PROD.Workspace/df_load_factsales.Dataflow" || echo "(refresh failed — likely needs destination bound in portal)"
